---
- name: Ensure tmp directory exists
  ansible.builtin.file:
    path: "{{ tmp_dir }}"
    state: directory
    mode: "1777"

- name: Clone the repository to /tmp
  ansible.builtin.git:
    repo: "{{ zilliqa[type].source_url }}"
    dest: "{{ tmp_dir }}/{{ project }}"
    version: "{{ zilliqa[type].version }}"
    force: true
    recursive: true

- name: Build the project using cargo
  ansible.builtin.command: cargo build --release --bin zilliqa
  args:
    chdir: "{{ tmp_dir }}/{{ service_identifier }}"
    creates: "{{ tmp_dir }}/{{ project }}/target/release/zilliqa"
  environment:
    PATH: "{{ rust.path }}/bin:{{ ansible_env.PATH }}"
    RUSTUP_HOME: "{{ rust.root }}/cargo"
    CARGO_HOME: "{{ rust.root }}/cargo"

- name: Copy the built binary to the target directory
  ansible.builtin.copy:
    src: "{{ tmp_dir }}/{{ project }}/target/release/zilliqa"
    dest: "{{ node_bin_dir }}/{{ service_identifier }}"
    mode: "0755"
    owner: root
    group: root
    remote_src: true
  notify:
    - Restart service

- name: Find the blocked recipients files
  ansible.builtin.find:
    paths: "{{ tmp_dir }}/{{ project }}/blocked_recipients"
    patterns: "*.bin"
  register: blocked_recipients_found

- name: Copy the blocked recipients files to the target directory
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ node_blocked_recipients_dir }}/{{ item.path | basename }}"
    mode: "0664"
    owner: root
    group: root
    remote_src: true
  loop: "{{ blocked_recipients_found.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  notify:
    - Restart service

- name: Find the escrow raw lists files
  ansible.builtin.find:
    paths: "{{ tmp_dir }}/{{ project }}/escrow_raw_lists"
    patterns: "*.bin"
  register: escrow_raw_lists_found

- name: Copy the escrow raw lists files to the target directory
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ node_escrow_raw_lists_dir }}/{{ item.path | basename }}"
    mode: "0664"
    owner: root
    group: root
    remote_src: true
  loop: "{{ escrow_raw_lists_found.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  notify:
    - Restart service

- name: Clean up the temporary repository directory
  ansible.builtin.file:
    path: "{{ tmp_dir }}/{{ project }}"
    state: absent
