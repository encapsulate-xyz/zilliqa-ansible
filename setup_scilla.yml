---
- name: Set up scilla
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup Pre Tasks
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml
          vars:
            type: scilla
        - name: Include dependencies setup tasks
          ansible.builtin.include_tasks: tasks/setup_dependencies.yml

  tasks:
    - name: Run scilla role
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include scilla role
          ansible.builtin.include_role:
            name: scilla
            public: true

  post_tasks:
    - name: Verify scilla
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ scilla_log_file_path }}"
            health_url: "http://localhost:{{ zilliqa.scilla.ports.scilla_port }}/run"
            health_method: POST
            health_body:
              jsonrpc: "2.0"
              method: "version"
              params: []
              id: 1
